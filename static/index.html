<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Assistant | E-Commerce AI Chat</title>
    <link rel="stylesheet" href="/static/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="chat-header">
            <div class="brand">
                <div class="logo">📦</div>
                <div>
                    <h1>Order Assistant</h1>
                    <p class="subtitle">Factual AI support over order dataset</p>
                </div>
            </div>
            <button id="new-chat-btn" class="btn secondary-btn" title="Clear conversation history">
                <span>➕</span> New Chat
            </button>
        </header>

        <!-- Main Chat Area -->
        <main class="chat-main" id="chat-window">
            <!-- Empty State / Welcome Screen -->
            <div id="empty-state" class="empty-state">
                <div class="welcome-card">
                    <div class="welcome-icon">🔍</div>
                    <h2>Welcome to Order Assistant</h2>
                    <p>Ask natural language questions about your online store's orders, revenue, customers, and inventory.</p>
                    
                    <div class="examples-section">
                        <h3>Try asking:</h3>
                        <div class="example-chips">
                            <button class="chip" data-question="What is the status of order ORD-1025?">
                                💬 What is the status of order ORD-1025?
                            </button>
                            <button class="chip" data-question="How many orders were cancelled?">
                                💬 How many orders were cancelled?
                            </button>
                            <button class="chip" data-question="What was the total revenue from Electronics in August?">
                                💬 What was the total revenue from Electronics in August?
                            </button>
                            <button class="chip" data-question="Which customer has spent the most?">
                                💬 Which customer has spent the most?
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Messages List -->
            <div id="messages-list" class="messages-list"></div>

            <!-- Typing / Loading Indicator -->
            <div id="loading-indicator" class="loading-indicator hidden">
                <div class="typing-bubble">
                    <span class="dot"></span>
                    <span class="dot"></span>
                    <span class="dot"></span>
                    <span class="loading-text">Assistant is thinking & calling tools...</span>
                </div>
            </div>
        </main>

        <!-- Global Error Banner -->
        <div id="error-banner" class="error-banner hidden">
            <span id="error-message">An error occurred.</span>
            <button id="retry-btn" class="btn error-retry-btn">Retry</button>
            <button id="dismiss-error-btn" class="close-btn">&times;</button>
        </div>

        <!-- Footer / Input Form -->
        <footer class="chat-footer">
            <form id="chat-form" class="input-form">
                <div class="textarea-wrapper">
                    <textarea 
                        id="user-input" 
                        placeholder="Ask about orders, revenue, customers... (e.g. 'Status of ORD-1025')" 
                        rows="1" 
                        maxlength="1000"
                        required
                    ></textarea>
                    <div class="char-counter" id="char-counter">0 / 1000</div>
                </div>
                <button type="submit" id="send-btn" class="btn primary-btn">
                    <span>Send</span>
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>
            </form>
        </footer>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
